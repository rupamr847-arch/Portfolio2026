<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rupam Bor | Video Producer &amp; Motion Specialist</title>
    <meta name="description" content="Portfolio of Rupam Bor, Award-nominated Video Production Manager and Motion Graphics Artist with 10+ years of experience in post-production, color grading, 2D/3D motion systems, and AI filmmaking." />
    <script>
      (function() {
        const removeTrialWarning = () => {
          document.querySelectorAll('div, section, article').forEach((el) => {
            if (el.textContent && (el.textContent.includes('Trial version of') || el.textContent.includes('ScrollSmoother deployed'))) {
              el.style.display = 'none';
              el.remove();
            }
          });
        };
        const observer = new MutationObserver(() => removeTrialWarning());
        document.addEventListener('DOMContentLoaded', () => {
          removeTrialWarning();
          if (document.body) {
            observer.observe(document.body, { childList: true, subtree: true });
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
